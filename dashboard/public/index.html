<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Shop | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
         🔐 شاشة تسجيل الدخول
    ============================================================= -->
    <div id="login-screen">
        <div class="login-card">
            <div class="brand">
                <div class="brand-emblem">E</div>
                <h1 class="brand-title">ECHO <span>SHOP</span></h1>
                <p class="brand-sub">لوحة التحكم الإدارية</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUsername" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <div id="loginError" class="login-error hidden">❌ بيانات الدخول غير صحيحة</div>
                <button type="submit" id="loginBtn">دخول 🔑</button>
            </form>
            <p class="login-note">🔒 لأمانك: ستحتاج لتسجيل الدخول من جديد عند أي تحديث للصفحة</p>
        </div>
    </div>

    <!-- ============================================================
         🛒 التطبيق الرئيسي
    ============================================================= -->
    <div id="app" class="hidden">
        <div class="container">

            <header>
                <div class="header-brand">
                    <div class="brand-emblem small">E</div>
                    <div>
                        <h1>ECHO <span>SHOP</span></h1>
                        <p class="header-sub">لوحة التحكم</p>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="stat-pill">
                        <span class="stat-label">المنتجات</span>
                        <span class="stat-value" id="productCount">0</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-label">عمليات ناجحة</span>
                        <span class="stat-value success" id="successCount">0</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn" title="تسجيل الخروج">🚪 خروج</button>
                </div>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" data-tab="products">📋 المنتجات</button>
                <button class="tab-btn" data-tab="add-product">➕ إضافة منتج</button>
                <button class="tab-btn" data-tab="logs">🧾 سجل المدفوعات</button>
            </nav>

            <section id="products-container" class="tab-panel active">
                <div class="panel-head">
                    <h2>💎 قائمة المنتجات</h2>
                    <input type="text" id="productSearch" class="search-box" placeholder="🔍 ابحث باسم المنتج...">
                </div>
                <div id="products"><div class="loader">جاري التحميل...</div></div>
            </section>

            <section id="add-product-container" class="tab-panel">
                <h2>➕ إضافة منتج جديد</h2>
                <form id="addProductForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>معرف الرتبة (Role ID)</label>
                            <input type="text" id="role_id" placeholder="مثال: 123456789012345678" required>
                        </div>
                        <div class="form-group">
                            <label>اسم المنتج</label>
                            <input type="text" id="name" placeholder="مثال: رتبة VIP" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>السعر (كريديت)</label>
                            <input type="number" id="price" placeholder="مثال: 1000000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>وصف المنتج</label>
                        <input type="text" id="description" placeholder="وصف مختصر عن الرتبة">
                    </div>
                    <div class="form-group">
                        <label>المميزات (كل سطر مميزة منفصلة)</label>
                        <textarea id="features" placeholder="مميزة 1&#10;مميزة 2&#10;مميزة 3" rows="4"></textarea>
                    </div>
                    <button type="submit">💎 إضافة المنتج</button>
                </form>
            </section>

            <section id="logs-container" class="tab-panel">
                <div class="panel-head">
                    <h2>🧾 سجل محاولات الدفع</h2>
                    <button id="refreshLogsBtn" class="secondary-btn">🔄 تحديث</button>
                </div>
                <div id="logs"><div class="loader">جاري التحميل...</div></div>
            </section>

        </div>
    </div>

    <!-- نافذة التعديل -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-box">
            <h2>✏️ تعديل المنتج</h2>
            <form id="editProductForm">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label>معرف الرتبة (Role ID)</label>
                    <input type="text" id="edit_role_id" required>
                </div>
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="edit_name" required>
                </div>
                <div class="form-group">
                    <label>السعر (كريديت)</label>
                    <input type="number" id="edit_price" required>
                </div>
                <div class="form-group">
                    <label>وصف المنتج</label>
                    <input type="text" id="edit_description">
                </div>
                <div class="form-group">
                    <label>المميزات</label>
                    <textarea id="edit_features" rows="4"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelEditBtn" class="secondary-btn">إلغاء</button>
                    <button type="submit">💾 حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
